name: Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        # Node.js is already installed via setup-node, no need to install nvm separately
        # The setup-node action already sets up the correct Node.js version
        echo "Node.js ${{ matrix.node-version }} is already available"
        node --version
        npm --version
        # Install any additional dependencies if needed

    - name: Run unit tests for telegram-media-send
      run: |
        echo "Running telegram-media-send unit tests..."
        node telegram-media-send/test/unit_test_telegram_send.mjs

    - name: Run tests for other skills if they exist
      run: |
        # Check for other skills with test directories
        for skill_dir in */; do
          if [ -d "$skill_dir/test" ] && [ -n "$(ls -A $skill_dir/test/*.mjs 2>/dev/null)" ]; then
            echo "Running tests for $(basename $skill_dir)..."
            for test_file in $skill_dir/test/*.mjs; do
              echo "Running test: $test_file"
              node "$test_file" || echo "Test failed: $test_file"
            done
          fi
        done

  test-python:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install pytest pyyaml pyfakefs pydantic supabase

    - name: Run minimax-usage unit tests
      run: |
        cd minimax-usage
        python -m pytest

    - name: Run todo-list unit tests
      run: |
        cd todo-list
        python -m pytest

  test-bash:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          git git-lfs jq rsync curl ca-certificates

    - name: Install age (binary release)
      run: |
        cd /tmp
        curl -fsSL --retry 3 -o age.tar.gz \
          https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
        echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  age.tar.gz" | sha256sum -c -
        tar -xzf age.tar.gz
        sudo install -m 0755 age/age /usr/local/bin/age
        sudo install -m 0755 age/age-keygen /usr/local/bin/age-keygen

    - name: Run hermes-backup-sync tests
      run: |
        bash hermes-backup-sync/tests/test_hermes_backup_sync.sh
